# Shared configuration for Workstream A and B.

# ROS topics required by the coursework brief.
cmd_vel_topic: "/groupidBot/cmd_vel"
scan_topic: "/groupidBot/laser/scan"
odom_topic: "/odom"
status_topic: "/groupidBot/q_learning_status"
reset_service: "/groupidBot/reset_episode"

# Start and delivery goal.
robot_model_name: "groupidBot"
start_x: 0.0
start_y: 0.0
start_z: 0.08
start_yaw: 0.0
goal_x: 6.0
goal_y: 4.0
goal_tolerance: 0.45

# Q-learning parameters.
max_episodes: 300
max_steps_per_episode: 400
control_rate_hz: 5.0
alpha: 0.30
gamma: 0.90
epsilon: 1.00
epsilon_min: 0.05
epsilon_decay: 0.995

# State encoder thresholds.
blocked_distance: 0.45
near_distance: 1.00
goal_close_distance: 0.60
goal_medium_distance: 2.50

# Action speeds.
linear_speed: 0.20
angular_speed: 0.65

# Reward design.
collision_distance: 0.24
near_obstacle_distance: 0.45
goal_reward: 100.0
collision_penalty: -100.0
step_penalty: -1.0
progress_reward_scale: 10.0
moved_away_penalty: -4.0
near_obstacle_penalty: -8.0
turn_penalty: -0.25

# Output paths. Adjust these after renaming the package/group ID.
results_dir: "~/catkin_ws/src/com760cw2_groupid/results"
q_table_path: "~/catkin_ws/src/com760cw2_groupid/results/q_table.json"
